# إعدادات الـ Edge Functions (النشر: supabase functions deploy admin-users driver-api)
# project_id عدّله لمعرّف مشروعك (supabase link --project-ref ...)
project_id = "elbanna-fleet"

# الدالتين بتتحققوا من الهوية بنفسهم (admin-users: JWT بتاع الموظف، driver-api: توكن السائق)،
# ومفاتيح Supabase الجديدة (sb_publishable_...) مش JWT فلازم verify_jwt = false
[functions.admin-users]
verify_jwt = false

[functions.driver-api]
verify_jwt = false
