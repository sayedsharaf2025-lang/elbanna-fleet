name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app (requests mode)
        run: npx vite build --mode requests
        env:
          # اختياري: لو عايز تثبّت مشروع Supabase في التطبيق بدل الافتراضي
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_SECRET: ${{ secrets.VITE_APP_SECRET }}

      - name: Add Android platform
        run: |
          npx cap add android
          # صلاحية الكاميرا (تصوير فواتير شراء قطع الغيار)
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      # توقيع ثابت: بنحط الـ keystore المحفوظ في Secrets مكان debug.keystore، فكل نسخة بتتوقّع بنفس المفتاح
      # وتقدر تتثبّت فوق النسخة القديمة من غير ما تمسحها. (لو الـ Secret مش موجود بيكمّل بمفتاح عشوائي مع تحذير)
      - name: Use fixed signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 غير مضبوط - الـ APK هيتوقّع بمفتاح عشوائي ومش هيتحدّث فوق القديم"
          else
            mkdir -p ~/.android
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: elbanna-requests-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
